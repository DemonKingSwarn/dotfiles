# vim:fileencoding=utf-8:foldmethod=marker

# Aether Theme with Sharp Corners (Hyprland-inspired)

# : Manager {{{

[mgr]
cwd = { fg = "#757b9d" }

# Find
find_keyword  = { fg = "#b39fc5", bold = true, italic = true, underline = true }
find_position = { fg = "#aaa2ce", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a1c4e4", bg = "#a1c4e4" }
marker_cut      = { fg = "#c4f6ff", bg = "#9c8ba9" }
marker_marked   = { fg = "#757b9d", bg = "#bad8ff" }
marker_selected = { fg = "#c4f6ff", bg = "#c4f6ff" }

# Count
count_copied   = { fg = "#060114", bg = "#a1c4e4" }
count_cut      = { fg = "#060114", bg = "#c4f6ff" }
count_selected = { fg = "#060114", bg = "#757b9d" }

# Border
border_symbol = "│"
border_style  = { fg = "#66656b" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#060114", bg = "#757b9d", bold = true }
inactive = { fg = "#757b9d", bg = "#060114" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#060114", bg = "#757b9d", bold = true }
normal_alt  = { fg = "#757b9d", bg = "#060114" }

# Select mode
select_main = { fg = "#060114", bg = "#a1c4e4", bold = true }
select_alt  = { fg = "#757b9d", bg = "#060114" }

# Unset mode
unset_main = { fg = "#060114", bg = "#aaa2ce", bold = true }
unset_alt  = { fg = "#757b9d", bg = "#060114" }

# : }}}


# : Status bar {{{

[status]
overall = { fg = "#757b9d" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }


# Progress
progress_label = { fg = "#060114", bold = true }
progress_normal = { fg = "#757b9d", bg = "#060114" }
progress_error = { fg = "#9c8ba9", bg = "#060114" }

# Permissions
perm_sep   = { fg = "#757b9d" }
perm_type  = { fg = "#a1c4e4" }
perm_read  = { fg = "#c4f6ff" }
perm_write = { fg = "#9c8ba9" }
perm_exec  = { fg = "#aaa2ce" }


# : }}}

# : Pick {{{

[pick]
border = { fg = "#757b9d" }
active = { fg = "#aaa2ce", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#757b9d" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#757b9d" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#757b9d" }
title   = {}
hovered = { fg = "#aaa2ce", underline = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#66656b" }
cand            = { fg = "#a1c4e4" }
rest            = { fg = "#d7dbe9" }
desc            = { fg = "#aaa2ce" }
separator       = "  "
separator_style = { fg = "#66656b" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#a1c4e4" }
run     = { fg = "#aaa2ce" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#060114", bg = "#d7dbe9" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#757b9d" }
title    = { fg = "#757b9d" }
tbl_col  = { fg = "#a1c4e4" }
tbl_cell = { fg = "#aaa2ce", bg = "#060114" }

# : }}}


# : Notify {{{

[notify]
title_info  = { fg = "#a1c4e4" }
title_warn  = { fg = "#9c8ba9" }
title_error = { fg = "#c4f6ff" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#c4f6ff" },

	# Media
	{ mime = "video/*", fg = "#9c8ba9" },
	{ mime = "audio/*", fg = "#9c8ba9" },

	# Archives
	{ mime = "application/zip",             fg = "#aaa2ce" },
	{ mime = "application/x-tar",           fg = "#aaa2ce" },
	{ mime = "application/x-bzip*",         fg = "#aaa2ce" },
	{ mime = "application/x-bzip2",         fg = "#aaa2ce" },
	{ mime = "application/x-7z-compressed", fg = "#aaa2ce" },
	{ mime = "application/x-rar",           fg = "#aaa2ce" },
	{ mime = "application/x-xz",            fg = "#aaa2ce" },

	# Documents
	{ mime = "application/doc",        fg = "#a1c4e4" },
	{ mime = "application/epub+zip",   fg = "#a1c4e4" },
	{ mime = "application/pdf",        fg = "#a1c4e4" },
	{ mime = "application/rtf",        fg = "#a1c4e4" },
	{ mime = "application/vnd.*",      fg = "#a1c4e4" },

  # Special files
  { mime = "*", is = "orphan", fg = "#060114", bg = "#9c8ba9" },
  { mime = "application/*exec*", fg = "#9c8ba9" },

	# Fallback
	{ url = "*", fg = "#d7dbe9" },
	{ url = "*/", fg = "#757b9d" },
]

# : }}}
