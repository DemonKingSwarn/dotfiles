general.live_config_reload = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#060114"
foreground = "#D7DBE9"

[colors.normal]
black   = "#060114"
red     = "#9c8ba9"
green   = "#a1c4e4"
yellow  = "#c4f6ff"
blue    = "#757b9d"
magenta = "#aaa2ce"
cyan    = "#bad8ff"
white   = "#D7DBE9"

[colors.bright]
black   = "#66656b"
red     = "#b39fc5"
green   = "#aedcff"
yellow  = "#bcfbff"
blue    = "#898fb9"
magenta = "#c1b6ee"
cyan    = "#caf0ff"
white   = "#f3f4ff"

[colors.cursor]
text   = "#060114"
cursor = "#D7DBE9"
[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "LythMono Nerd Font", style = "Regular" }
bold = { family = "LythMono Nerd Font", style = "Bold" }
italic = { family = "LythMono Nerd Font", style = "Italic" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"
dynamic_title = true
dynamic_padding = true
#opacity = 0.9
startup_mode = "Windowed"


[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]
